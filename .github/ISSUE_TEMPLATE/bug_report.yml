name: Bug report
description: Report a reproducible Achilles defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use GitHub private vulnerability reporting.
        Remove tokens, credentials, private prompts and workspace contents from logs.
  - type: input
    id: commit
    attributes:
      label: Achilles commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, WSL version, Python, GPU/driver, install profile and relevant runtimes.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact commands or API calls that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed credentials and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
