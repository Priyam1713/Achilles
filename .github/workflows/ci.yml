name: ci

# The kernel suite must remain runnable without downloading models or accessing a GPU.
#
# Nothing here downloads model weights, starts a GPU runtime or touches WSL: the kernel
# suite is deliberately runnable without any of them, which is what makes it a usable CI
# signal on a hosted runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel tests
    runs-on: ubuntu-latest
    # The proven workstation path executes the Python kernel inside WSL2. Native Windows
    # kernel coverage returns only after its Unix-specific process tests have explicit
    # platform boundaries; the separate desktop job still validates Tauri on Windows.

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  desktop:
    name: desktop build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Tauri crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  docs:
    name: documentation invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # A repository whose own baseline invariant is "open source, end to end" shipped for
      # weeks with no LICENSE file (research wave 8, D-033). This check exists so that
      # specific failure cannot recur silently.
      - name: Required project files
        run: |
          for f in LICENSE NOTICE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md \
                   SUPPORT.md CHANGELOG.md README.md \
                   knowledge/research.md docs/IMPLEMENTATION_STATUS.md; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          grep -q "Apache License" LICENSE || { echo "LICENSE is not the Apache licence"; exit 1; }
          grep -q '^license' pyproject.toml || { echo "pyproject.toml has no license field"; exit 1; }

      - name: Validate configuration manifests
        run: uv run python -c "import yaml,glob,sys; [yaml.safe_load(open(p, encoding='utf-8')) for p in glob.glob('configs/*.yaml')]; print('configs parse')"
