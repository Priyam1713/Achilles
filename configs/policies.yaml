defaults:
  fail_closed: true
  raw_secret_visibility: deny
  untrusted_content_can_issue_instructions: false

risk_rules:
  - match: {action: "read", scope: "workspace"}
    risk: low
    approval: false
  - match: {action: "write", scope: "workspace"}
    risk: medium
    approval: false
    verify: diff
  - match: {action: "execute", scope: "workspace"}
    risk: medium
    approval: false
    verify: exit_code
  - match: {action: "delete", scope: "workspace"}
    risk: high
    approval: true
    verify: existence
  - match: {action: "write", scope: "host"}
    risk: high
    approval: true
    verify: diff
  - match: {action: "execute", scope: "host"}
    risk: high
    approval: true
  - match: {action: "credential", scope: "any"}
    risk: high
    approval: true
    reveal_secret_to_model: false
  - match: {action: "network_post", scope: "untrusted"}
    risk: high
    approval: true
  - match: {action: "gui", scope: "destructive"}
    risk: high
    approval: true
  - match: {action: "gui", scope: "non_destructive"}
    risk: medium
    approval: false

  # Added with the tool plane (knowledge/research.md D-034). Memory recall is a read and
  # is rated like one; a memory *write* mutates state, so the untrusted-content gate in
  # PolicyEngine still blocks an agent from writing memory without a grant or approval --
  # that is the intended default, not an oversight (D-038).
  - match: {action: "read", scope: "memory"}
    risk: low
    approval: false
  - match: {action: "write", scope: "memory"}
    risk: medium
    approval: false
  # Read-only web search through the locally deployed SearXNG. Deliberately distinct from
  # network_post:untrusted above, which stays approval-gated: fetching public results is
  # not the same risk as sending data outward. What comes back is untrusted_web content
  # and cannot authorise anything (baseline invariant 4, D-037).
  - match: {action: "network_get", scope: "public_web"}
    risk: medium
    approval: false

  # Launching and calling an external MCP server (knowledge/research.md D-023). The kernel
  # cannot know whether a third-party tool reads, writes or sends mail, so it is treated as
  # a mutating execution and fails closed on the unknown: high risk, approval required, and
  # in practice an active execute:external_mcp grant.
  - match: {action: "execute", scope: "external_mcp"}
    risk: high
    approval: true

trust_labels:
  - trusted_user
  - trusted_local
  - untrusted_web
  - untrusted_email
  - untrusted_document
  - untrusted_model_output
  - untrusted_collaboration
  - execution_result
  - verified_result
