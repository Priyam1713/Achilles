version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
# Empty means ordinary outbound network is denied; managed inference.local remains separate.
network_policies: {}
network_middlewares: {}
